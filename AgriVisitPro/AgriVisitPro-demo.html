<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriVisit Pro — CRM Allevamenti</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #34A44A;
      --green-l: #e8f5eb;
      --blue:    #2d6fdb;
      --blue-l:  #e8f0fc;
      --orange:  #e07b2a;
      --orange-l:#fdf0e4;
      --red:     #d93025;
      --red-l:   #fce8e6;
      --gray:    #6b7280;
      --bg:      #f4f6f8;
      --card:    #ffffff;
      --border:  #e5e7eb;
      --text:    #111827;
      --text2:   #6b7280;
      --radius:  14px;
      --shadow:  0 2px 12px rgba(0,0,0,.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .topbar-icon {
      width: 36px; height: 36px;
      background: var(--green);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .topbar h1 { font-size: 18px; font-weight: 700; }
    .topbar-badge {
      margin-left: auto;
      background: var(--green-l);
      color: var(--green);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ── LAYOUT ── */
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 0;
      height: calc(100vh - 65px);
    }

    /* ── SIDEBAR ── */
    .sidebar {
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-title { font-size: 15px; font-weight: 600; flex: 1; }
    .btn-add {
      background: var(--green);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: background .15s;
    }
    .btn-add:hover { background: #2a8a3c; }

    .search-wrap { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .search-wrap input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    .search-wrap input:focus { border-color: var(--green); }

    .visit-list { overflow-y: auto; flex: 1; }

    /* ── VISIT ROW ── */
    .visit-row {
      display: flex;
      align-items: stretch;
      padding: 12px 16px;
      gap: 10px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .12s;
      position: relative;
    }
    .visit-row:hover { background: var(--bg); }
    .visit-row.active { background: var(--green-l); }
    .visit-row.cancelled { opacity: .55; }

    .tipo-bar {
      width: 5px;
      border-radius: 3px;
      flex-shrink: 0;
      align-self: stretch;
    }
    .tipo-bar.programmata { background: var(--blue); }
    .tipo-bar.spot        { background: var(--orange); }
    .tipo-bar.cortesia    { background: var(--green); }

    .row-body { flex: 1; min-width: 0; }
    .row-top { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
    .row-name {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .row-name.strike { text-decoration: line-through; }
    .badge-ann {
      background: var(--red);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .row-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .row-meta span { font-size: 12px; color: var(--text2); }
    .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); }

    .tipo-chip {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .tipo-chip.programmata { background: var(--blue-l);   color: var(--blue); }
    .tipo-chip.spot        { background: var(--orange-l); color: var(--orange); }
    .tipo-chip.cortesia    { background: var(--green-l);  color: var(--green); }

    /* ── DETAIL PANEL ── */
    .detail {
      overflow-y: auto;
      padding: 32px;
      background: var(--bg);
    }
    .detail-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 680px;
      margin: 0 auto;
    }

    .detail-header {
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .detail-icon {
      width: 48px; height: 48px;
      background: var(--green-l);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .detail-title-wrap { flex: 1; }
    .detail-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .detail-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      font-size: 12px; font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .chip.programmata { background: var(--blue-l);   color: var(--blue); }
    .chip.spot        { background: var(--orange-l); color: var(--orange); }
    .chip.cortesia    { background: var(--green-l);  color: var(--green); }
    .chip.green  { background: var(--green-l);  color: var(--green); }
    .chip.gray   { background: #f3f4f6; color: var(--gray); }
    .chip.red    { background: var(--red-l); color: var(--red); }

    .detail-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      border: none; border-radius: 8px; padding: 8px 16px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn:hover { opacity: .82; }
    .btn-primary  { background: var(--green); color: #fff; }
    .btn-outline  { background: #fff; color: var(--text); border: 1px solid var(--border); }
    .btn-danger   { background: var(--red-l); color: var(--red); }
    .btn-restore  { background: var(--blue-l); color: var(--blue); }

    .detail-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }

    .section-label {
      font-size: 11px; font-weight: 700; color: var(--text2);
      text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: 10px;
    }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { background: var(--bg); border-radius: 10px; padding: 12px 16px; }
    .field-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
    .field-value { font-size: 14px; font-weight: 500; }

    .note-box {
      background: var(--bg);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
    }
    .status-bar.active    { background: var(--green-l); color: var(--green); }
    .status-bar.cancelled { background: var(--red-l);   color: var(--red); }

    .detail-footer {
      padding: 16px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* ── EMPTY STATE ── */
    .empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 12px; color: var(--text2);
    }
    .empty-icon { font-size: 52px; }
    .empty h2 { font-size: 18px; font-weight: 600; color: var(--text); }
    .empty p { font-size: 14px; text-align: center; line-height: 1.5; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--card);
      border-radius: var(--radius);
      width: 500px; max-width: 95vw;
      box-shadow: 0 8px 40px rgba(0,0,0,.18);
      transform: translateY(20px);
      transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .modal-header h2 { font-size: 17px; font-weight: 700; flex: 1; }
    .modal-close {
      background: var(--bg); border: none;
      width: 30px; height: 30px; border-radius: 50%;
      font-size: 16px; cursor: pointer; color: var(--gray);
      display: flex; align-items: center; justify-content: center;
    }

    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }

    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 5px; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color .15s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--green); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 10px;
    }

    /* ── CONFIRM DIALOG ── */
    .confirm-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 300;
      opacity: 0; pointer-events: none;
      transition: opacity .15s;
    }
    .confirm-overlay.open { opacity: 1; pointer-events: all; }
    .confirm-box {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      width: 360px; max-width: 95vw;
      box-shadow: 0 8px 40px rgba(0,0,0,.18);
      text-align: center;
    }
    .confirm-box .ci { font-size: 40px; margin-bottom: 12px; }
    .confirm-box h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .confirm-box p { font-size: 13px; color: var(--text2); line-height: 1.5; margin-bottom: 20px; }
    .confirm-btns { display: flex; gap: 10px; justify-content: center; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--text); color: #fff;
      padding: 12px 18px; border-radius: 10px;
      font-size: 14px; font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      transform: translateY(20px); opacity: 0;
      transition: all .25s;
      z-index: 400;
      display: flex; align-items: center; gap: 8px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .detail { display: none; }
      .layout.detail-open .sidebar { display: none; }
      .layout.detail-open .detail { display: block; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-icon">🌾</div>
  <h1>AgriVisit Pro</h1>
  <span class="topbar-badge">CRM Allevamenti</span>
</div>

<!-- LAYOUT -->
<div class="layout" id="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Visite</span>
      <button class="btn-add" onclick="openModal()">
        <span>+</span> Nuova visita
      </button>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="🔍  Cerca allevamento…" oninput="renderList()" />
    </div>
    <div class="visit-list" id="visitList"></div>
  </aside>

  <!-- DETAIL -->
  <main class="detail" id="detailPanel">
    <div class="empty" id="emptyState">
      <div class="empty-icon">📋</div>
      <h2>Nessuna visita selezionata</h2>
      <p>Seleziona una visita dalla lista<br>o aggiungine una nuova.</p>
    </div>
    <div class="detail-card" id="detailCard" style="display:none"></div>
  </main>

</div>

<!-- MODAL: NUOVA VISITA -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span style="font-size:20px">🌿</span>
      <h2 id="modalTitle">Nuova Visita</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>NOME ALLEVAMENTO *</label>
        <input type="text" id="fNome" placeholder="Es. Allevamento Rossi" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>DATA VISITA</label>
          <input type="date" id="fData" />
        </div>
        <div class="form-group">
          <label>TIPO VISITA</label>
          <select id="fTipo">
            <option>Programmata</option>
            <option>Spot</option>
            <option>Cortesia</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>ARGOMENTO</label>
        <select id="fArgomento">
          <option>Genetica</option>
          <option>Consulenza</option>
          <option>Alimentazione</option>
          <option>Grossista</option>
        </select>
      </div>
      <div class="form-group">
        <label>NOTE (opzionale)</label>
        <textarea id="fNote" placeholder="Inserisci eventuali note…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="saveVisita()">💾 Salva</button>
    </div>
  </div>
</div>

<!-- CONFIRM: ANNULLA VISITA -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="ci">⚠️</div>
    <h3>Annulla visita?</h3>
    <p>La visita verrà contrassegnata come annullata. Potrai ripristinarla in seguito.</p>
    <div class="confirm-btns">
      <button class="btn btn-outline" onclick="closeConfirm()">Indietro</button>
      <button class="btn btn-danger" onclick="confirmCancel()">Annulla visita</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  // ── DATA ──────────────────────────────────────────────────
  const TIPI = ['Programmata', 'Spot', 'Cortesia'];
  const ARGOMENTI = ['Genetica', 'Consulenza', 'Alimentazione', 'Grossista'];

  let visite = [
    { id: 1, nome: 'Allevamento Rossi', data: '2026-03-15', tipo: 'Programmata', argomento: 'Genetica',      note: 'Prima visita di controllo annuale. Ottima risposta al piano riproduttivo.', annullata: false },
    { id: 2, nome: 'Fattoria Bianchi',  data: '2026-03-12', tipo: 'Spot',        argomento: 'Alimentazione', note: 'Verifica urgente scorte foraggio. Carenza rilevata, ordinato integratore.',  annullata: false },
    { id: 3, nome: 'Agri Verde SRL',    data: '2026-03-08', tipo: 'Cortesia',    argomento: 'Consulenza',    note: '',                                                                           annullata: true  },
    { id: 4, nome: 'Podere Ferrara',    data: '2026-02-28', tipo: 'Programmata', argomento: 'Grossista',     note: 'Accordo rinnovo contratto per la fornitura semestrale.',                     annullata: false },
    { id: 5, nome: 'Az. Agricola Neri', data: '2026-02-20', tipo: 'Spot',        argomento: 'Genetica',      note: 'Richiesta consulenza urgente per selezione nuovi capi.',                     annullata: false },
    { id: 6, nome: 'Cascina Moretti',   data: '2026-02-10', tipo: 'Cortesia',    argomento: 'Consulenza',    note: '',                                                                           annullata: false },
  ];
  let nextId = 10;
  let selectedId = null;
  let editingId = null;
  let pendingCancelId = null;
  let editMode = false;

  // ── HELPERS ───────────────────────────────────────────────
  const tipoClass = t => t.toLowerCase().replace(/à/g,'a');
  const fmt = d => new Date(d + 'T12:00:00').toLocaleDateString('it-IT', { day:'numeric', month:'long', year:'numeric' });
  const fmtShort = d => new Date(d + 'T12:00:00').toLocaleDateString('it-IT', { day:'numeric', month:'short', year:'numeric' });

  // ── RENDER LIST ───────────────────────────────────────────
  function renderList() {
    const q = document.getElementById('search').value.toLowerCase();
    const el = document.getElementById('visitList');
    const filtered = visite.filter(v => v.nome.toLowerCase().includes(q));
    if (!filtered.length) {
      el.innerHTML = `<div class="empty" style="height:200px"><div class="empty-icon">🔍</div><p>Nessun risultato</p></div>`;
      return;
    }
    el.innerHTML = filtered.map(v => `
      <div class="visit-row ${v.annullata ? 'cancelled' : ''} ${v.id === selectedId ? 'active' : ''}"
           onclick="selectVisita(${v.id})">
        <div class="tipo-bar ${tipoClass(v.tipo)}"></div>
        <div class="row-body">
          <div class="row-top">
            <span class="row-name ${v.annullata ? 'strike' : ''}">${v.nome}</span>
            ${v.annullata ? '<span class="badge-ann">ANNULLATA</span>' : ''}
          </div>
          <div class="row-meta">
            <span>📅 ${fmtShort(v.data)}</span>
            <div class="dot"></div>
            <span>${v.argomento}</span>
          </div>
          <span class="tipo-chip ${tipoClass(v.tipo)}">${v.tipo}</span>
        </div>
      </div>
    `).join('');
  }

  // ── SELECT ────────────────────────────────────────────────
  function selectVisita(id) {
    selectedId = id;
    editMode = false;
    renderList();
    renderDetail();
  }

  // ── RENDER DETAIL ─────────────────────────────────────────
  function renderDetail() {
    const empty = document.getElementById('emptyState');
    const card  = document.getElementById('detailCard');
    if (!selectedId) { empty.style.display='flex'; card.style.display='none'; return; }
    const v = visite.find(x => x.id === selectedId);
    if (!v) { empty.style.display='flex'; card.style.display='none'; return; }
    empty.style.display = 'none';
    card.style.display  = 'block';

    if (editMode) {
      card.innerHTML = `
        <div class="detail-header">
          <div class="detail-icon">✏️</div>
          <div class="detail-title-wrap">
            <div class="detail-title">Modifica Visita</div>
            <div class="detail-chips">
              <span class="chip ${tipoClass(v.tipo)}">${v.tipo}</span>
              <span class="chip gray">${v.argomento}</span>
            </div>
          </div>
        </div>
        <div class="modal-body" style="padding:24px 28px">
          <div class="form-group">
            <label>NOME ALLEVAMENTO *</label>
            <input type="text" id="eNome" value="${v.nome}" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>DATA VISITA</label>
              <input type="date" id="eData" value="${v.data}" />
            </div>
            <div class="form-group">
              <label>TIPO VISITA</label>
              <select id="eTipo">${TIPI.map(t=>`<option ${t===v.tipo?'selected':''}>${t}</option>`).join('')}</select>
            </div>
          </div>
          <div class="form-group">
            <label>ARGOMENTO</label>
            <select id="eArgomento">${ARGOMENTI.map(a=>`<option ${a===v.argomento?'selected':''}>${a}</option>`).join('')}</select>
          </div>
          <div class="form-group">
            <label>NOTE</label>
            <textarea id="eNote">${v.note}</textarea>
          </div>
        </div>
        <div class="detail-footer">
          <button class="btn btn-outline" onclick="cancelEdit()">Annulla</button>
          <button class="btn btn-primary" onclick="saveEdit()">💾 Salva modifiche</button>
        </div>`;
    } else {
      card.innerHTML = `
        <div class="detail-header">
          <div class="detail-icon">🏠</div>
          <div class="detail-title-wrap">
            <div class="detail-title ${v.annullata ? 'strike' : ''}">${v.nome}</div>
            <div class="detail-chips">
              <span class="chip ${tipoClass(v.tipo)}">${v.tipo}</span>
              <span class="chip gray">${v.argomento}</span>
              ${v.annullata ? '<span class="chip red">Annullata</span>' : '<span class="chip green">Attiva</span>'}
            </div>
          </div>
          <div class="detail-actions">
            ${!v.annullata ? `<button class="btn btn-outline" onclick="startEdit()">✏️ Modifica</button>` : ''}
          </div>
        </div>
        <div class="detail-body">
          <div>
            <div class="section-label">Dettagli Visita</div>
            <div class="field-grid">
              <div class="field">
                <div class="field-label">Data</div>
                <div class="field-value">📅 ${fmt(v.data)}</div>
              </div>
              <div class="field">
                <div class="field-label">Tipo</div>
                <div class="field-value" style="color:${v.tipo==='Programmata'?'var(--blue)':v.tipo==='Spot'?'var(--orange)':'var(--green)'};font-weight:600">${v.tipo}</div>
              </div>
              <div class="field">
                <div class="field-label">Argomento</div>
                <div class="field-value">${v.argomento}</div>
              </div>
              <div class="field">
                <div class="field-label">Stato</div>
                <div class="field-value" style="color:${v.annullata?'var(--red)':'var(--green)'}">${v.annullata?'❌ Annullata':'✅ Attiva'}</div>
              </div>
            </div>
          </div>
          <div>
            <div class="section-label">Note</div>
            <div class="note-box">${v.note || '<span style="color:var(--text2);font-style:italic">Nessuna nota inserita.</span>'}</div>
          </div>
          <div>
            <div class="section-label">Gestione Stato</div>
            <div class="status-bar ${v.annullata ? 'cancelled' : 'active'}">
              <span>${v.annullata ? '❌' : '✅'}</span>
              <span>${v.annullata ? 'Questa visita è stata annullata.' : 'Questa visita è attiva.'}</span>
            </div>
          </div>
        </div>
        <div class="detail-footer">
          ${v.annullata
            ? `<button class="btn btn-restore" onclick="ripristinaVisita(${v.id})">↩️ Ripristina visita</button>`
            : `<button class="btn btn-danger"  onclick="openConfirm(${v.id})">🚫 Annulla visita</button>`
          }
        </div>`;
    }
  }

  // ── EDIT ─────────────────────────────────────────────────
  function startEdit()  { editMode = true;  renderDetail(); }
  function cancelEdit() { editMode = false; renderDetail(); }

  function saveEdit() {
    const v = visite.find(x => x.id === selectedId);
    const nome = document.getElementById('eNome').value.trim();
    if (!nome) { showToast('⚠️ Il nome è obbligatorio', true); return; }
    v.nome      = nome;
    v.data      = document.getElementById('eData').value;
    v.tipo      = document.getElementById('eTipo').value;
    v.argomento = document.getElementById('eArgomento').value;
    v.note      = document.getElementById('eNote').value.trim();
    editMode = false;
    renderList();
    renderDetail();
    showToast('✅ Modifiche salvate');
  }

  // ── MODAL ────────────────────────────────────────────────
  function openModal() {
    document.getElementById('fNome').value = '';
    document.getElementById('fData').value = new Date().toISOString().slice(0,10);
    document.getElementById('fTipo').value = 'Programmata';
    document.getElementById('fArgomento').value = 'Genetica';
    document.getElementById('fNote').value = '';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('fNome').focus(), 200);
  }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

  function saveVisita() {
    const nome = document.getElementById('fNome').value.trim();
    if (!nome) { showToast('⚠️ Il nome è obbligatorio', true); return; }
    const v = {
      id: nextId++,
      nome,
      data:      document.getElementById('fData').value,
      tipo:      document.getElementById('fTipo').value,
      argomento: document.getElementById('fArgomento').value,
      note:      document.getElementById('fNote').value.trim(),
      annullata: false,
    };
    visite.unshift(v);
    closeModal();
    selectedId = v.id;
    renderList();
    renderDetail();
    showToast('🌿 Visita aggiunta');
  }

  // ── CANCEL / RESTORE ─────────────────────────────────────
  function openConfirm(id) { pendingCancelId = id; document.getElementById('confirmOverlay').classList.add('open'); }
  function closeConfirm()  { document.getElementById('confirmOverlay').classList.remove('open'); }

  function confirmCancel() {
    const v = visite.find(x => x.id === pendingCancelId);
    if (v) { v.annullata = true; }
    closeConfirm();
    renderList();
    renderDetail();
    showToast('🚫 Visita annullata');
  }

  function ripristinaVisita(id) {
    const v = visite.find(x => x.id === id);
    if (v) { v.annullata = false; }
    renderList();
    renderDetail();
    showToast('✅ Visita ripristinata');
  }

  // ── TOAST ────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, warn = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = warn ? 'var(--orange)' : 'var(--text)';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── KEYBOARD ─────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeConfirm(); }
  });

  // ── INIT ─────────────────────────────────────────────────
  renderList();
</script>
</body>
</html>
